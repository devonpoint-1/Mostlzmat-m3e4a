/* Layout: a dark petrol "operations spine" on the right (RTL) holding navigation,

}

    const dem=demand0*(1+(on?sc.surge/100:0));
    const inf=inL+inI*(1-(on?sc.importLoss/100:0));
    required+=dem;supplied+=inf;
    const mi=Math.floor(d/30);reqM[mi]+=dem;supM[mi]+=inf;

}

function resolveType(v){const n=norm(v);if(n.includes('مستشف')||n.includes('hospital'))return 'hospital';if(n.includes('مخبز')||n.includes('bakery'))return 'bakery';if(n.includes('طاق')||n.includes('كهرب')||n.includes('energy')||n.includes('power'))return 'energy';if(n.includes('اتصال')||n.includes('telecom'))return 'telecom';return 'other'}
function toNum(s){const t=String(s==null?'':s).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[٬,\s]/g,'').replace('٫','.');const n=parseFloat(t);return isFinite(n)?n:NaN}
function parseDate(v){if(!v)return daysAgo(0);const d=new Date(v);return isFinite(d.getTime())?d.toISOString().slice(0,10):daysAgo(0)}
function splitLine(l,d){const out=[];let cur='',q=false;for(let i=0;i<l.length;i++){const ch=l[i];if(q){if(ch==='"'){if(l[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}else if(ch==='"')q=true;else if(ch===d){out.push(cur);cur=''}else cur+=ch}out.push(cur);return out.map(x=>x.trim())}
function parseCSV(t){
  const lines=String(t).replace(/\r/g,'').split('\n').filter(l=>l.trim());
  if(lines.length<2)return {head:[],rows:[]};
  const hd=lines[0],d=['\t',';',','].map(x=>[x,hd.split(x).length]).sort((a,b)=>b[1]-a[1])[0][0];
  return {head:splitLine(hd,d),rows:lines.slice(1).map(l=>splitLine(l,d))};
}
function buildImport(target,text,src,tag){
  const res={map:[],unmapped:[],rows:[],bad:[],defaults:0};
  const P=parseCSV(String(text||'').replace(/^﻿/,''));
  if(!P.head.length){res.err='لا توجد بيانات. يلزم سطر عناوين وسطر واحد على الأقل.';return res}
  const allowed={stock:['wh','comm','qty','sector','loss','date'],sup:['name','comm','perDay','origin','date','lead'],inst:['name','type','sector','comm','perDay','qty','date']}[target];
  P.head.forEach((h,i)=>{const f=CANON_MAP[norm(h)];if(f&&allowed.includes(f)&&!res.map.some(m=>m.f===f))res.map.push({i,h,f});else res.unmapped.push(h)});
  const col=f=>{const m=res.map.find(x=>x.f===f);return m?m.i:-1};
  const need={stock:['comm','qty'],sup:['comm','perDay'],inst:['comm','perDay','qty']}[target];
  const miss=need.filter(f=>col(f)<0);
  if(miss.length){res.err='أعمدة مطلوبة غير موجودة: '+miss.map(f=>CANON_LBL[f]).join('، ')+'. العناوين الموجودة: '+P.head.join('، ');return res}
  const batch=uid();
  P.rows.forEach((cells,ri)=>{
    const g=f=>{const i=col(f);return i<0?'':String(cells[i]==null?'':cells[i])};
    const ln=ri+2,comm=resolveComm(g('comm'));
    if(!comm){res.bad.push(`سطر ${ln}: سلعة غير معروفة «${g('comm')}»`);return}
    const base={id:uid(),ex:false,src:src||'نظام خارجي',batch,tag,comm,date:parseDate(g('date'))};
    const sec=()=>{const s=resolveSector(g('sector'));if(!s)res.defaults++;return s||'gov'};
    if(target==='stock'){
      const q=toNum(g('qty'));if(!(q>=0)){res.bad.push(`سطر ${ln}: كمية غير صالحة «${g('qty')}»`);return}
      const l=toNum(g('loss'));
      res.rows.push(Object.assign(base,{wh:g('wh')||'مخزن مستورد',qty:q,sector:sec(),loss:isNaN(l)?0:l}));
    }else if(target==='sup'){
      const q=toNum(g('perDay'));if(!(q>=0)){res.bad.push(`سطر ${ln}: إمداد يومي غير صالح «${g('perDay')}»`);return}
      let o=resolveOrigin(g('origin'));if(!o){res.defaults++;o='local'}
      const l=toNum(g('lead'));
      res.rows.push(Object.assign(base,{name:g('name')||'مورد مستورد',perDay:q,origin:o,lead:isNaN(l)?0:l}));
    }else{
      const q=toNum(g('perDay')),s=toNum(g('qty'));
      if(!(q>=0)||!(s>=0)){res.bad.push(`سطر ${ln}: استهلاك أو مخزون غير صالح`);return}
      res.rows.push(Object.assign(base,{name:g('name')||'مؤسسة مستوردة',type:resolveType(g('type')),sector:sec(),perDay:q,stock:s}));
    }
  });
  return res;
}

function spark(r){
  const W=320,H=100,pl=8,pr=8,pt=8,pb=18,days=S.settings.days;
  const max=Math.max(1,...r.base.series,...r.scn.series);
  const x=i=>W-pr-(W-pl-pr)*i/days;
  const y=v=>pt+(H-pt-pb)*(1-v/max);
  const path=s=>s.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join(' ');
  const sc=S.scenario;
  let win='';
  if(r.scn.applies&&sc.duration>0){
    const a=Math.min(days,sc.start),b=Math.min(days,sc.start+sc.duration);
    if(b>a)win=`<rect x="${x(b).toFixed(1)}" y="${pt}" width="${(x(a)-x(b)).toFixed(1)}" height="${H-pt-pb}" fill="var(--warn-soft)"/>`;
  }
  const col=r.scn.first===null?'var(--good)':(r.scn.first<=S.settings.warnDays?'var(--crit)':'var(--warn)');
  const mk=r.scn.first!==null?`<circle cx="${x(r.scn.first).toFixed(1)}" cy="${y(0).toFixed(1)}" r="4" fill="var(--crit)"/>`:'';
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="مسار مخزون ${esc(r.c.name)} على مدى ${days} يومًا">

function actText(r){
  const c=r.c,u=c.unit;
  if(r.ev==='none')return 'لا توجد بيانات مخزون أو إمداد لهذه السلعة. أدخلها في سجل المخازن وسجل الموردين أولًا.';
  let t=r.scn.unmet>0?`المطلوب شراؤه أو إنتاجه أو تأمينه: ${nf(r.scn.unmet)} ${u} قبل اليوم ${r.scn.first}.`:`لا عجز متوقع خلال المدة. المتبقي في نهايتها ${nf(r.scn.end)} ${u}.`;
  if(S.scenario.kind!=='none'&&r.base.unmet>0)t+=` حتى دون أزمة يظهر عجز ${nf(r.base.unmet)} ${u} بدءًا من اليوم ${r.base.first}.`;

}

  <h2>القاموس الموحد للبيانات</h2>

  <div class="tw"><table style="min-width:620px"><thead><tr><th style="width:26%">الحقل الموحد</th><th>الأسماء المقبولة</th></tr></thead><tbody>${Object.keys(CANON).map(f=>`<tr><td><b>${esc(CANON_LBL[f])}</b></td><td>${esc(CANON[f].join('، '))}</td></tr>`).join('')}</tbody></table></div>`;
}
function vDecisions(){
  const R=computeAll(),w=S.settings,P=S.policy,DS=decStats();
  const bands=[`نقص خلال ${w.warnDays} يومًا`,`نقص بين ${w.warnDays} و${2*w.warnDays} يومًا`,`نقص بعد ${2*w.warnDays} يومًا`];
  const SO={crit:'حرجة',high:'عالية',med:'متوسطة',low:'منخفضة'};
  const classes=Object.keys(P.matrix);
  const matrix=classes.map((cls,ci)=>`<tr><td><b>${esc(cls)}</b></td>${[0,1,2].map(i=>`<td><select id="pol-${ci}-${i}" data-k="pol" data-id="${esc(cls)}" data-f="${i}" aria-label="${esc(cls)}: ${bands[i]}">${opts(SO,P.matrix[cls][i])}</select></td>`).join('')}</tr>`).join('');
  const cards=R.map(r=>{
    const c=r.c,u=c.unit,sev=sevOf(r);
    if(sev==='none')return `<article class="ccard" style="grid-column:1/-1"><header><h3>${esc(c.name)}</h3><span class="pill good">لا عجز متوقع</span></header><p class="muted act">لا إجراء مطلوب تحت السيناريو الحالي.</p></article>`;
    const p=prescribe(r),sens=sensitivity(c),route=routeOf(r);
    const n1=`مخزون خارج النطاق المختار: ${nf(p.outScope)} ${esc(u)} · فوائض مؤسسات: ${nf(p.instSur)} ${esc(u)}`;
    const n2=p.av2===0?'لا موردون بدلاء مسجلون لهذه السلعة.':(p.used.length?p.used.map(x=>`${esc(x.name)}: خلال ${x.lead} يومًا${x.late>0?` (يتأخر ${x.late} يومًا عن بدء النقص)`:''}`).join('<br>'):'غير مطلوب بعد البديل الأول.');
    const n3=p.q3>0?`خفض الاستهلاك بنسبة ${nf(p.cut)}% من اليوم ${r.scn.first} حتى نهاية الخطة${p.cut>=100?' (لا يكفي)':(p.cut>30?' (نسبة كبيرة وغير عملية غالبًا)':'')}`:'غير مطلوب.';
    const btn=(q,alt)=>q>0?`<button type="button" class="btn sm" data-act="mkdec" data-id="${c.id}" data-alt="${alt}">إنشاء قرار</button>`:'—';
    return `<article class="ccard" style="grid-column:1/-1"><header><h3>${esc(c.name)}</h3><div class="pills"><span class="pill ${SEVCLS[sev]}">خطورة ${SEV[sev]}</span>${route==='human'?'<span class="pill warn">يتطلب اعتمادًا بشريًا</span>':'<span class="pill good">مؤهل للاعتماد دون لجنة</span>'}${evPill(r.ev)}</div></header>
      <p class="act"><b>نقطة التلاشي:</b> بعد ${nf(r.scn.zero)} يومًا (${fdate(r.scn.zero)}) · العجز المتوقع ${nf(r.scn.unmet)} ${esc(u)}.</p>
      <h3>البدائل مرتبة حسب السرعة والتوفر</h3>
      <div class="tw"><table class="alts" style="min-width:640px"><thead><tr><th>البديل</th><th>المتاح</th><th>يغطي</th><th>التفاصيل</th><th></th></tr></thead><tbody>
        <tr><td>1. ${ALT.redistribute}</td><td>${nf(p.av1)} ${esc(u)}</td><td>${nf(p.q1)} ${esc(u)}</td><td class="alt-note">${n1}</td><td>${btn(p.q1,'redistribute')}</td></tr>
        <tr><td>2. ${ALT.accelerate}</td><td>${nf(p.av2)} ${esc(u)}</td><td>${nf(p.q2)} ${esc(u)}</td><td class="alt-note">${n2}</td><td>${btn(p.q2,'accelerate')}</td></tr>
        <tr><td>3. ${ALT.reschedule}</td><td>—</td><td>${nf(p.q3)} ${esc(u)}</td><td class="alt-note">${esc(n3)}</td><td>${btn(p.q3,'reschedule')}</td></tr></tbody></table></div>
      <p class="muted" style="font-size:12.5px;margin:0">الترتيب بالسرعة والتوفر. ترتيبها بالتكلفة يحتاج أسعار وحدات غير مدخلة في هذا النموذج.</p>
      <h3>حساسية نقطة التلاشي لتأخر الإمداد المستورد طوال الخطة</h3>
      <div class="tw"><table class="sens" style="min-width:460px"><thead><tr>${sens.map(s=>`<th>تأخر ${s.p}%</th>`).join('')}</tr></thead><tbody><tr>${sens.map(s=>`<td>${s.zero===null?'لا نقص':nf(s.zero)+' يومًا'}</td>`).join('')}</tr></tbody></table></div>
      <h3>التنبيه الموجّه</h3>
      <p class="report">${esc(alertText(r,p,sev,route))}</p>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button type="button" class="btn ghost sm" data-act="copyalert" data-id="${c.id}">نسخ التنبيه</button>${ui.flash==='al-'+c.id?'<span class="okmsg">تم النسخ</span>':''}</div></article>`;
  }).join('');
  const rows=S.dec.map(d=>{
    const c=commById(d.comm),i='dec-'+d.id;
    return `<tr><td style="white-space:nowrap">${esc((d.t||'').slice(0,10))}</td><td>${esc(c.name)}</td><td>${esc(ALT[d.alt]||d.alt)}${d.supplier?`<br><span class="muted">${esc(d.supplier)}</span>`:''}</td><td style="white-space:nowrap">${nf(d.qty)} ${esc(c.unit)}</td><td><span class="pill ${SEVCLS[d.sev]||'none'}">${SEV[d.sev]||''}</span></td><td>${d.route==='human'?'اعتماد بشري':'دون لجنة'}</td>
    <td><select id="${i}-status" data-k="dec" data-id="${d.id}" data-f="status" aria-label="الحالة">${['مسودة','معتمد','مرفوض'].map(x=>`<option${x===d.status?' selected':''}>${x}</option>`).join('')}</select></td>
    <td><select id="${i}-outcome" data-k="dec" data-id="${d.id}" data-f="outcome" aria-label="النتيجة"${d.status!=='معتمد'?' disabled':''}>${opts({'':'قيد المتابعة',success:'نجح في منع العجز',partial:'نجح جزئيًا',fail:'لم ينجح'},d.outcome||'')}</select></td>
    <td style="white-space:nowrap"><button type="button" class="btn ghost sm" data-act="copypo" data-id="${d.id}">نسخ النص</button>${ui.flash==='po-'+d.id?' <span class="okmsg">تم</span>':''} ${delBtn('dec',d.id)}</td></tr>`;
  }).join('');
  return `<h1 class="title">القرارات والإجراءات</h1>
  <p class="lead">عند اكتشاف عجز محتمل لا يكتفي النظام بالتحذير، بل يجيب عن السؤال: ما الإجراء الأمثل لتجنب هذا العجز؟ يقترح البدائل ويحدد من يعتمد القرار، ثم يسجل النتيجة لتحسين التوصيات لاحقًا.</p>
  ${exNotice()}
  ${ui.fb?`<div class="panel" style="margin-bottom:14px"><label class="lab" for="fb-text">انسخ النص يدويًا:</label><textarea id="fb-text" readonly>${esc(ui.fb)}</textarea></div>`:''}
  <section class="panel"><h2 style="margin-top:0">سياسة القرار</h2>
    <h3>مصفوفة درجة الخطورة</h3>
    <p class="muted" style="font-size:13.5px">تصنيف التنبؤات حسب الأهمية الاستراتيجية للسلعة وموعد النقص.</p>
    <div class="tw"><table style="min-width:520px"><thead><tr><th>تصنيف السلعة</th>${bands.map(b=>`<th>${b}</th>`).join('')}</tr></thead><tbody>${matrix}</tbody></table></div>
    <h3 style="margin-top:14px">صلاحيات التدخل (Approval Flow)</h3>
    <div class="fields"><div class="field"><label for="pol-auto">أقصى عجز دون لجنة (% من الاحتياج)</label><input id="pol-auto" type="number" min="0" max="100" step="any" value="${P.autoMaxPct}" data-k="pol" data-f="autoMaxPct"></div></div>
    <p class="muted" style="font-size:13.5px;margin:8px 0 0">يتطلب القرار اعتمادًا بشريًا إذا كانت الخطورة حرجة أو عالية، أو كان العجز أكبر من هذه النسبة. القاعدة بحجم العجز لأن أسعار الوحدات غير مدخلة.</p></section>
  <h2>الإجراءات المقترحة حسب السلعة</h2>
  <div class="ccards">${cards}</div>
  <h2>سجل القرارات والتغذية الراجعة</h2>
  <p class="muted">${DS.n?`${DS.n} قرارات لها نتيجة مسجلة: نجح ${DS.s}، جزئيًا ${DS.p}، لم ينجح ${DS.f}. معدل النجاح ${DS.rate}%.`:'سجّل نتيجة كل قرار معتمد. هذا السجل أساس معايرة التوصيات لاحقًا، ولا يعدّل النموذج تلقائيًا في هذه النسخة.'}</p>
  <div class="tw"><table style="min-width:980px"><thead><tr><th>التاريخ</th><th>السلعة</th><th>الإجراء</th><th>الكمية</th><th>الخطورة</th><th>المسار</th><th>الحالة</th><th>النتيجة</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan="9" class="muted">لا قرارات بعد. أنشئ قرارًا من أحد البدائل أعلاه.</td></tr>'}</tbody></table></div>`;
}
const VIEWFN={plan:vPlan,architecture:vArch,ingest:vIngest,decisions:vDecisions,dashboard:vDashboard,engine:vEngine,stock:vStock,suppliers:vSuppliers,institutions:vInst,catalog:vCatalog,memo:vMemo,units:vUnits,governance:vGov,roadmap:vRoadmap,audit:vAudit,backup:vBackup};
const root=document.getElementById('root');
function render(keepScroll){
  const cur=route(),y=window.scrollY;
  const nav=NAV.map(g=>`<div class="grp">${g[0]}</div>`+g[1].map(x=>`<a href="#${x[0]}"${x[0]===cur?' aria-current="page"':''}>${x[1]}</a>`).join('')).join('');
  root.innerHTML=`<div class="app"><aside class="side"><div class="side-in gut"><div class="brand"><p class="mark">القواهر</p><p class="sub">منظومة تدبير المستلزمات المعيشية لمصر — أفق 9 أشهر</p></div><nav class="nav" aria-label="التنقل">${nav}</nav></div></aside><main class="main"><div class="page gut">${VIEWFN[cur]()}</div></main></div>`;
  if(keepScroll)window.scrollTo(0,y);else window.scrollTo(0,0);
  if(ui.fb){const t=document.getElementById('fb-text');if(t){t.focus();t.select()}}
}
function commit(msg,keep){if(msg)log(msg);save();render(keep!==false)}
function flash(k){ui.flash=k;render(true);setTimeout(()=>{if(ui.flash===k){ui.flash=null;render(true)}},2500)}
async function copyText(t,k){
  try{await navigator.clipboard.writeText(t);ui.fb=null;flash(k)}
  catch(e){ui.fb=t;render(true)}
}
function applyPreset(k){
  if(k==='custom'){S.scenario.kind='custom';S.scenario.label=S.scenario.label&&S.scenario.kind!=='port'?S.scenario.label:'سيناريو مخصص'}
  else{const p=PRE[k];S.scenario={kind:k,label:k==='port'?(S.scenario.label||'الميناء X'):p.name,duration:p.duration,importLoss:p.importLoss,surge:p.surge,start:p.start,targets:Array.isArray(p.targets)?p.targets.slice():p.targets}}
  commit('تغيير السيناريو إلى: '+scTitle());
}
function clamp(v,a,b){return Math.min(b,Math.max(a,v))}
root.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='preset'){applyPreset(t.value);return}
  if(t.id==='import-text'){ui.importText=t.value;return}
  if(t.id==='ing-target'){ui.ing.target=t.value;ui.ing.res=null;render(true);return}
  if(t.id==='ing-src'){ui.ing.src=t.value;return}
  if(t.id==='ing-tag'){ui.ing.tag=t.value;ui.ing.res=null;return}
  if(t.id==='ing-text'){ui.ing.text=t.value;ui.ing.res=null;return}
  if(t.id==='ing-file'){const f=t.files&&t.files[0];if(f){const fr=new FileReader();fr.onload=()=>{ui.ing.text=String(fr.result||'');ui.ing.res=null;render(true)};fr.readAsText(f,'utf-8')}return}
  const k=t.dataset&&t.dataset.k;if(!k)return;
  const f=t.dataset.f,id=t.dataset.id;
  const isNum=t.type==='number';
  let v=isNum?num(t.value):t.value;
  if(k==='set'){
    const lim={pop:[1000,1e9],days:[1,365],critDays:[1,365],warnDays:[1,365],staleDays:[1,365]};
    if(lim[f])v=clamp(v,lim[f][0],lim[f][1]);
    S.settings[f]=v;commit('تعديل إعداد الخطة: '+f+' = '+v);return;
  }
  if(k==='sc'){
    const lim={duration:[0,365],start:[0,365],importLoss:[0,100],surge:[0,300]};
    if(lim[f])v=clamp(v,lim[f][0],lim[f][1]);
    if(f!=='label'&&S.scenario.kind!=='port'&&S.scenario.kind!=='custom'){S.scenario.label=PRE[S.scenario.kind].name+' (معدّل)';S.scenario.kind='custom'}
    S.scenario[f]=v;commit('تعديل السيناريو: '+scTitle());return;
  }
  if(k==='pol'){if(f==='autoMaxPct'){S.policy.autoMaxPct=clamp(v,0,100)}else if(S.policy.matrix[id]){S.policy.matrix[id][+f]=v}commit('تعديل سياسة القرار');return}
  if(k==='coef'){const c=S.comms.find(x=>x.id===id);if(c){c.coef[f]=Math.max(0,v);commit('تعديل معامل '+c.name+' ('+f+')')}return}
  if(k==='comm'){const c=S.comms.find(x=>x.id===id);if(c){c[f]=v;commit('تعديل بطاقة سلعة: '+c.name)}return}
  const arr=S[k];if(!arr)return;
  const r=arr.find(x=>x.id===id);if(!r)return;
  if(isNum)v=Math.max(0,v);
  r[f]=v;r.ex=false;
  commit('تعديل سجل ('+k+'): '+(r.wh||r.name||'')+' · '+f);
});
root.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,id=b.dataset.id;
  if(a==='level'){S.settings.level=id;commit('تغيير مستوى الطاقة إلى '+LV[id]);return}
  if(a==='target'){
    const sc=S.scenario;
    if(id==='all')sc.targets='all';
    else{let cur=sc.targets==='all'?S.comms.map(c=>c.id):sc.targets.slice();cur=cur.includes(id)?cur.filter(x=>x!==id):cur.concat(id);sc.targets=(!cur.length||cur.length===S.comms.length)?'all':cur}
    if(sc.kind!=='port'&&sc.kind!=='custom'&&sc.kind!=='none'){sc.label=PRE[sc.kind].name+' (معدّل)';sc.kind='custom'}
    commit('تعديل السلع المتأثرة بالسيناريو');return;
  }
  if(a==='del'){const k=b.dataset.k,arr=S[k],i=arr.findIndex(x=>x.id===id);if(i>=0){const r=arr[i];arr.splice(i,1);commit('حذف سجل ('+k+'): '+(r.wh||r.name||''))}return}
  if(a==='clearex'){['stock','sup','inst'].forEach(k=>{S[k]=S[k].filter(r=>!r.ex)});commit('مسح الأمثلة التوضيحية وبدء الإدخال الفعلي');return}
  if(a==='copyreport'){copyText(reportText(computeAll()),'report');return}
  if(a==='copyjson'){copyText(JSON.stringify(S,null,2),'json');return}
  if(a==='ingsample'){ui.ing.text=SAMPLES[ui.ing.target]();ui.ing.res=null;render(true);return}
  if(a==='ingprev'){
    const el=document.getElementById('ing-text'),sr=document.getElementById('ing-src');
    if(el)ui.ing.text=el.value;if(sr)ui.ing.src=sr.value;
    ui.ing.res=buildImport(ui.ing.target,ui.ing.text,ui.ing.src,ui.ing.tag);render(true);return;
  }
  if(a==='ingdo'){
    const res=ui.ing.res,tg=ui.ing.target;if(!res||res.err||!res.rows.length)return;
    const src=ui.ing.src||'نظام خارجي';
    S[tg].push(...res.rows);S.lastBatch={id:res.rows[0].batch,target:tg,n:res.rows.length,src};
    ui.ing.res=null;ui.ing.text='';
    commit('استيراد '+res.rows.length+' سجلات من «'+src+'» إلى '+ING_T[tg]);return;
  }
  if(a==='ingundo'){const lb=S.lastBatch;if(lb){S[lb.target]=S[lb.target].filter(r=>r.batch!==lb.id);S.lastBatch=null;commit('تراجع عن دفعة استيراد من «'+lb.src+'»')}return}
  if(a==='mkdec'){
    const r=computeAll().find(x=>x.c.id===id);if(!r)return;
    const p=prescribe(r);if(!p)return;
    const alt=b.dataset.alt,sev=sevOf(r),route=routeOf(r),u=r.c.unit;
    const mk=o=>S.dec.unshift(Object.assign({id:uid(),t:new Date().toISOString(),comm:id,sev,route,status:'مسودة',outcome:'',first:r.scn.first,zero:r.scn.zero,unmet:r.scn.unmet,scn:scTitle()},o));
    if(alt==='redistribute')mk({alt,qty:p.q1,detail:`نقل ${nf(p.q1)} ${u} من مخزون خارج النطاق المختار أو فوائض المؤسسات`});
    if(alt==='accelerate')p.used.forEach(s=>mk({alt,qty:s.qty,supplier:s.name,detail:`توريد ${nf(s.qty)} ${u} من «${s.name}» بدءًا من اليوم ${s.lead} وبمعدل ${nf(s.perDay)} ${u}/يوم`}));
    if(alt==='reschedule')mk({alt,qty:p.q3,detail:`خفض استهلاك ${r.c.name} بنسبة ${nf(p.cut)}% من اليوم ${r.scn.first} حتى نهاية الخطة`});
    commit('إنشاء قرار ('+ALT[alt]+') لسلعة '+r.c.name);return;
  }
  if(a==='copyalert'){const r=computeAll().find(x=>x.c.id===id);if(!r)return;const p=prescribe(r);if(!p)return;copyText(alertText(r,p,sevOf(r),routeOf(r)),'al-'+id);return}
  if(a==='copypo'){const d=S.dec.find(x=>x.id===id);if(d)copyText(poText(d),'po-'+id);return}
  if(a==='import'){
    const el=document.getElementById('import-text');ui.importText=el?el.value:'';
    try{
      const o=JSON.parse(ui.importText);
      if(!(o&&o.v===1&&Array.isArray(o.stock)&&Array.isArray(o.sup)&&Array.isArray(o.inst)&&Array.isArray(o.comms)&&o.settings&&o.scenario))throw new Error('x');
      adopt(o);
      ui.importErr=null;ui.importText='';commit('استيراد نسخة احتياطية');
    }catch(err){ui.importErr='النص ليس نسخة صالحة من القواهر.';render(true)}
    return;
  }
  if(a==='reset'){
    if(ui.confirm==='reset'){ui.confirm=null;S=seed();log('إعادة ضبط البيانات إلى الأمثلة');save();render(false)}
    else{ui.confirm='reset';render(true);setTimeout(()=>{if(ui.confirm==='reset'){ui.confirm=null;render(true)}},4000)}
  }
});
root.addEventListener('submit',e=>{
  const f=e.target.closest('form[data-add]');if(!f)return;
  e.preventDefault();
  const k=f.dataset.add,fd=Object.fromEntries(new FormData(f).entries());
  const r={id:uid(),ex:false,date:fd.date||daysAgo(0),tag:fd.tag||'usr'};
  if(k==='stock'){Object.assign(r,{wh:fd.wh,comm:fd.comm,qty:num(fd.qty),sector:fd.sector,loss:num(fd.loss)})}
  if(k==='sup'){Object.assign(r,{name:fd.name,comm:fd.comm,perDay:num(fd.perDay),origin:fd.origin,lead:num(fd.lead)})}
  if(k==='inst'){Object.assign(r,{name:fd.name,type:fd.type,sector:fd.sector,comm:fd.comm,perDay:num(fd.perDay),stock:num(fd.stock)})}
  S[k].push(r);
  commit('إضافة سجل ('+k+'): '+(r.wh||r.name));
});
window.addEventListener('hashchange',()=>{ui.fb=null;render(false)});
load();
render(false);
</script>

</body></html>
